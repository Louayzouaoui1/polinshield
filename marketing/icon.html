<!doctype html>
<html><head><meta charset="utf-8"><title>PolinShield icon</title>
<!-- macOS app icon, 1024x1024: rounded-square plate with the logo. Rendered by render.mjs. -->
<style>
*{margin:0}
html,body{width:1024px;height:1024px;background:transparent;overflow:hidden}
.plate{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;
  background:radial-gradient(600px 500px at 30% 15%,rgba(94,230,255,.28),transparent 60%),
             radial-gradient(500px 500px at 80% 95%,rgba(63,217,138,.22),transparent 60%),
             linear-gradient(160deg,#111a22,#070a0e);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 20px 40px rgba(0,0,0,.35);display:grid;place-items:center}
img{width:600px;height:600px;filter:drop-shadow(0 18px 40px rgba(94,230,255,.3))}
</style></head>
<body><div class="plate"><img src="../docs/brand/logo.svg" alt=""></div></body></html>
